name: Publish staging to main

# Promotes staging to main (the GitHub Pages publish branch).
on:
  push:
    branches: [staging]
  workflow_run:
    workflows: ["Regenerate RSS feed"]
    types: [completed]
    branches: [staging]
  workflow_dispatch:

# Serialize promotions so they can't race into a conflict on main.
concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # From the feed workflow, only promote a successful run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      # Fast-forward push. Treat "main already has our commit" as success (a concurrent run may have pushed it), retry the race window, and fail only on genuine divergence.
      - name: Promote staging to main
        run: |
          head="$(git rev-parse HEAD)"
          for attempt in 1 2 3; do
            git fetch --quiet origin main || true
            if git merge-base --is-ancestor "$head" origin/main; then
              echo "main already contains $head."
              exit 0
            fi
            git push origin "HEAD:main" && exit 0
            echo "Attempt $attempt failed (main moved); retrying..."
            sleep $((attempt * 3))
          done
          echo "Failed to promote $head; main may have diverged." >&2
          exit 1
